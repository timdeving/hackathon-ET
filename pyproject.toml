# Tool settings only. The project is not an installable package: the harness imports
# solution.py from the repository root, and solution.py imports src/.

[tool.ruff]
line-length = 100
target-version = "py310"
# The organizers' files are kept byte-identical, so they are not linted.
extend-exclude = ["run_submission.py", "evaluate.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
