# Every tunable number in the pipeline, each with a note on where its value came from.
# "Starting value" means a placeholder until it is tuned against our dev labels.

budget:
  # The harness's limit for Part A + Part B together, as a multiple of the video's duration:
  # run_submission.py's default, which the official run uses.
  time_factor: 3.0
  # Frames OpenCV reads, before Part A starts, to measure how long the harness's Part B
  # decoding will take on this machine (about 2 s of video).
  calibration_frames: 60
  # Multiply that estimate by this, in case the start of a video decodes faster than the rest.
  # Starting value: check it against the part_b_sec the harness logs on the GPU PC.
  part_b_safety: 1.2
  # Part B's own work on top of decoding, as a multiple of the duration: 0 while step() is the
  # stub; set it when the risk pipeline arrives.
  part_b_extra_ratio: 0.0
  # Fraction of the budget left unused, for the harness's own overhead. Starting value.
  margin_ratio: 0.05

video:
  # Analyse every Nth frame (every frame is decoded anyway: H.264 frames depend on each other).
  # Starting value: 3, about 10 frames per second at 29.97 fps; the starter kit notes every
  # 2nd-3rd frame is usually enough. Decode speed (tools/bench_decode.py) and dev scores decide.
  stride: 3
  # Width in pixels of the working image handed to the detector (the full frame is 3840 wide).
  # Starting value: 1280; decode speed and recall on far-away objects decide.
  width: 1280
  # Decoder threads; 0 lets FFmpeg use one per CPU core.
  decode_threads: 0

detector:
  # TorchScript file in weights/, made by tools/export_detector.py (see weights/README.md). Its
  # input width must equal video.width. Starting choice: YOLO26m, Ultralytics' newest COCO model,
  # which is NMS-free; tools/check_detector.py and tools/bench_detector.py compare it with other
  # sizes and with YOLO11 on the GPU PC.
  weights: yolo26m_736x1280_fp16.torchscript
  # Keep detections scoring at least this. Starting value: 0.1, ByteTrack's low-score threshold;
  # the tracker uses low-scoring boxes to keep hold of partly hidden objects.
  conf: 0.1
  # Overlap above which NMS drops the weaker of two same-class boxes; used only for models with
  # raw output (YOLO11). Ultralytics' predict() default.
  iou: 0.7
  # At most this many detections per frame. Ultralytics' predict() default.
  max_det: 300
  # COCO class ids we keep: road users, traffic lights, and animals that could be on the road.
  classes:
    0: person
    1: bicycle
    2: car
    3: motorcycle
    5: bus
    7: truck
    9: traffic light
    15: cat
    16: dog
    17: horse
    18: sheep
    19: cow

tracker:
  # ByteTrack (Zhang et al., 2022). Unless noted, values are the reference implementation's
  # defaults. Those were tuned at 30 updates per second and we update ~10 times per second
  # (video.stride 3), so check ID switches on our own tracks before tuning rules on top.
  # Detections scoring at least this take part in the first matching round.
  high_score: 0.5
  # Detections between low_score and high_score can only extend existing tracks (second round).
  # Equal to detector.conf.
  low_score: 0.1
  # Only detections scoring at least this start a new track (ByteTrack: high_score + 0.1).
  new_track_score: 0.6
  # Largest accepted matching cost, where cost = 1 - similarity:
  match_cost_high: 0.8  # first round, similarity = IoU x detection score
  match_cost_low: 0.5  # second round (weak detections), similarity = IoU
  match_cost_new: 0.7  # a new track's confirming match, similarity = IoU x score
  # A lost track overlapping a tracked one of the same group by more than this IoU is a
  # duplicate (ByteTrack removes pairs closer than IoU distance 0.15).
  duplicate_iou: 0.85
  # How long an unmatched track is kept in case the object reappears, in seconds
  # (ByteTrack: 30 frames at 30 fps).
  lost_seconds: 1.0
  # Detections only match tracks of the same group: a pedestrian passing in front of a car never
  # takes the car's ID, while a vehicle the detector calls "car" then "truck" keeps its ID.
  # Our own addition; the reference ByteTrack ignores classes.
  class_groups:
    vehicle: [2, 5, 7]  # car, bus, truck
    two_wheeler: [1, 3]  # bicycle, motorcycle
    person: [0]
    traffic_light: [9]
    animal: [15, 16, 17, 18, 19]

alignment:
  # Camera alignment (src/scene/alignment.py): each video's empty-road background is matched with
  # the reference picture's, SIFT features plus a RANSAC homography. Starting values;
  # tools/align_videos.py reports inliers and errors on the samples.
  # Both pictures are resized to this width for matching: the width of configs/scene/reference.jpg.
  match_width: 1920
  # SIFT features kept per picture, strongest first.
  features: 8000
  # Lowe's ratio test: keep a match only if it beats the second-best by this factor (Lowe, 2004).
  ratio: 0.75
  # A match agrees with a homography if it lands within this many pixels, at match_width
  # (4 px at 4K). RANSAC gives up after ransac_iterations samples.
  ransac_px: 2.0
  ransac_iterations: 5000
  # Sanity check: with fewer agreeing matches than this, or a bigger change of view, the estimate
  # isn't trusted and the video is treated as unshifted. The samples differ by up to 139 px (3.6%
  # of the width), 1.1 degrees and 1.4% of zoom (PLAN.md, measured facts); the limits are
  # RULES_DESIGN.md §1's, well above that.
  min_inliers: 50
  max_shift: 0.10  # largest corner shift, as a fraction of the frame width
  max_rotation_deg: 5.0
  max_zoom: 0.10  # largest change of scale, as a fraction

features:
  # Per-object features (src/features/tracks.py; docs/RULES_DESIGN.md §2). Speeds are in box
  # heights per second until the scene map has ground points in metres. Every value here is a
  # starting value: check it against speed histograms from the real track cache, then tune it
  # with tools/eval_from_cache.py.
  # Centred moving average of the boxes over this many seconds (5 updates at stride 3): long
  # enough to average out detector jitter, short enough to keep boundaries within ~0.1 s.
  smooth_sec: 0.5
  # Moving: at least this fast. Below it, the direction of motion is noise.
  moving_speed: 0.3
  # Stationary from below stop_enter until above stop_exit: two thresholds, so the state doesn't
  # flicker while speed hovers around one.
  stop_enter: 0.1
  stop_exit: 0.25
  # A person whose box overlaps a bicycle or motorcycle box by more than this share of its own
  # area, in at least half of its frames, is a rider, not a pedestrian.
  rider_overlap: 0.3
  # A person whose box lies inside a car, bus or truck box by more than occupant_overlap, in at
  # least occupant_frames of its frames, is seen through the windscreen, not walking.
  occupant_overlap: 0.8
  occupant_frames: 0.8

rules:
  # Classes predicted. Enabling one is a team decision, taken once its dev F1 is decent and the
  # class is plausible here: predicting a class the test set lacks adds a zero to Score A
  # (PLAN.md B1). tools/eval_from_cache.py measures every rule, enabled or not.
  enabled: []
  # One section per rule (src/rules/<class>.py); all starting values until tuned on dev labels.
  jaywalking:
    # Feet must be at least this far inside the road outline (reference pixels): ignores feet
    # jittering around the kerb.
    edge_margin_px: 20
    # On the road outside a crossing for at least this long (docs/RULES_DESIGN.md §5).
    min_sec: 1.0
    # Gaps up to this long are bridged: feet flickering across a crossing's edge.
    gap_sec: 0.5
  failure_to_yield:
    # The bottom share of a vehicle's box taken as its outline on the ground.
    footprint_share: 0.4
    # A pedestrian's feet within this many reference pixels of a crossing count as stepping
    # onto it.
    approach_margin_px: 30
    # The vehicle must move at least this fast while the pedestrian is there (box heights per
    # second); slower is creeping in a queue.
    min_speed: 0.5
  wrong_way:
    # Heading against the lane: cosine with the lane's flow below this (-0.5: more than 120 deg
    # off; docs/RULES_DESIGN.md §5).
    against: -0.5
    # Slower movement doesn't count: reversing out of a space, creeping in a queue.
    min_speed: 0.5
    min_sec: 1.0
    gap_sec: 0.5
  solid_line_crossing:
    # The second corner must cross within this many seconds of the first; a lane change takes
    # 1-3 s.
    max_sec: 4.0
  stopped_vehicle:
    # Stationary at least this long: the task's definition.
    min_sec: 10.0
    # Moments of apparent motion (box jitter) up to this long don't end a stop.
    gap_sec: 1.0
    # Queued, not stopped: within this many of its own box heights of its lane's stop line, or of
    # a stationary vehicle ahead in the same lane.
    queue_gap: 2.5
  congestion:
    # Crawling: the median speed of a direction's vehicles below this (box heights per second;
    # the same as features.moving_speed).
    crawl: 0.3
    # At least this many vehicles in the direction's lanes...
    min_vehicles: 3
    # ...occupying at least this share of them ("across all lanes").
    lane_share: 1.0
    # Long enough to outlast a red light: a red-light queue that clears on the next green isn't
    # congestion (labelling convention, pending organizer question Q1).
    min_sec: 60.0
    # Flickers up to this long (a lane briefly empty, a missed detection) don't end a jam.
    gap_sec: 5.0
  stop_line:
    # Stationary past the line at least this long (docs/RULES_DESIGN.md §5).
    min_sec: 1.0
    gap_sec: 0.5
  illegal_u_turn:
    # A U-turn: the heading reverses by at least turn_deg (150: within 30 deg of reversed) within
    # max_sec; it starts where the heading leaves its earlier direction by start_deg
    # (docs/RULES_DESIGN.md §5).
    turn_deg: 150
    start_deg: 20
    max_sec: 20.0

postprocess:
  # Applied to every class unless overridden under per_class (same keys, per class id).
  default:
    # Join two segments of the same class separated by less than this gap (seconds).
    # Starting value: the starter kit's advice to merge gaps < 1 s; tune at tIoU 0.7.
    merge_gap_sec: 1.0
    # Drop segments shorter than this (seconds). Must stay > 0.
    # Starting value: the starter kit's advice to drop blips < 0.5 s; tune at tIoU 0.7.
    min_duration_sec: 0.5
  per_class: {}

stitching:
  # Track stitching (src/perception/stitching.py), Part A only: a track that vanishes
  # mid-picture is joined to one of the same class group that appears where its motion predicts.
  # Starting values from the samples' track caches (2026-09-26): of 2692 tracks that end
  # mid-picture, the best same-group successor within 8 s is closer than 0.25 box heights for 556,
  # 0.25-0.5 for 414, 0.5-1 for 384, then spread evenly out to 10 box heights (coincidences).
  # The two ends, each carried by its own velocity to the middle of the gap, must meet within this
  # many box heights: the edge of the peak of close successors, for precision.
  max_distance: 0.5
  # Longest gap joined: 84% of the close successors (under 1 box height) reappear within 5 s.
  max_gap_sec: 5.0
  # Box heights may change by at most this factor across the gap: a partly hidden object's box
  # shrinks (the close successors' height ratios span 0.78-1.84 from the 5th to 95th percentile).
  max_size_change: 2.0
  # A track whose box ends or starts within this fraction of the picture's border left or entered
  # the picture, and is never joined.
  edge_margin: 0.02
  # An end's velocity: the least-squares slope of the positions over its last (or first) second.
  velocity_sec: 1.0
